# syntax=docker/sandbox-kit:3
# U9 probe: a kit-declared deny rule. pypi.org is allowed by the global `balanced` policy, so
# this checks whether a kit can narrow egress below the host policy.
schemaVersion: "3"
displayName: Deny probe
description: Denies pypi.org at runtime, to check that kit deny rules narrow egress.
kind: mixin
version: "0.1.0"

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        deny: [pypi.org]
