[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepagents-docker-sbx"
version = "0.1.1"
description = "Docker sbx backed sandbox backend for DeepAgents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Philippe von Bergen" }]
keywords = ["deepagents", "docker", "sbx", "sandbox", "langchain", "langgraph", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "deepagents>=0.6.7",
]

[dependency-groups]
dev = [
    "build>=1.2.0",
    "pytest>=9.0.0",
    "ruff>=0.9.0",
    "twine>=6.0.0",
]
prototype = [
    "langchain-openai>=1.7.2",
    "langgraph-sdk>=0.4.2",
]

[project.urls]
Homepage = "https://github.com/pvbergen/deepagents-docker-sbx"
Repository = "https://github.com/pvbergen/deepagents-docker-sbx"

[tool.hatch.build.targets.wheel]
packages = ["src/deepagents_docker_sbx", "src/subagents_docker_sbx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "sbx: integration tests that create real sbx sandboxes (opt in with DEEPAGENTS_SBX_INTEGRATION=1)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    # isort
    "I",

    # Pyflakes
    "F",

    # Pyupgrade
    "UP",
]
